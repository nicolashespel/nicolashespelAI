[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nicolas-workflows"
version = "0.1.0"
description = "Workflows Mistral durables de Nicolas Hespel (revue mensuelle et rituels)."
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
